<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeaveMAS UI</title>
  <script>
    (function() {
      let saved = null;
      try {
        saved = window.localStorage ? window.localStorage.getItem('weavemas-ui-theme') : null;
      } catch (err) {
        saved = null;
      }
      const theme = saved === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <script src="/preload.js"></script>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen text-xs select-none">
  <!-- Flat Native AGY Header & Run Selector -->
  <header id="header-root"></header>

  <div class="max-w-4xl mx-auto p-3 space-y-4">

    <!-- Horizontal Pipeline Stepper (Seamless / No Card) -->
    <section id="stepper-root" class="py-2.5 px-1">
      <div class="relative my-2">
        <!-- Connecting Line through circle centers -->
        <div id="stepper-line" class="stepper-line" style="display: none;"></div>

        <!-- Stage Dots Row -->
        <div id="stages-stepper-row" class="relative z-10 flex justify-between items-start">
          <!-- Rendered dynamically via app.js -->
        </div>
      </div>
    </section>

    <!-- Multi-Stage Agents Panel (Always Visible) -->
    <main id="agents-root">
      <!-- Dynamically mounted multi-stage agents panel -->
    </main>
  </div>

  <script src="trackers/header_bar.js"></script>
  <script src="trackers/runtime_tracker.js"></script>
  <script src="trackers/agent_panel.js"></script>
  <script src="trackers/stage_panel.js"></script>
  <script src="app.js"></script>
</body>
</html>

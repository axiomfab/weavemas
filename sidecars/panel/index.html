<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeaveMAS UI</title>
  <script src="/preload.js"></script>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="p-3 bg-[#090d16] text-[#e2e8f0] min-h-screen text-xs select-none">
  
  <div class="max-w-4xl mx-auto space-y-4">
    <!-- Header & Project Selector -->
    <header id="header-root"></header>

    <!-- Horizontal Pipeline Stepper (Seamless / No Card) -->
    <section id="stepper-root" class="py-2.5 px-1">
      <div class="relative my-2">
        <!-- Connecting Line through circle centers -->
        <div id="stepper-line" class="stepper-line"></div>

        <!-- Stage Dots Row -->
        <div id="stages-stepper-row" class="relative z-10 flex justify-between items-start">
          <!-- Rendered dynamically via app.js -->
        </div>
      </div>
    </section>

    <!-- Multi-Stage Agents Panel (Always Visible) -->
    <main id="agents-root">
      <!-- Dynamically mounted multi-stage agents panel -->
    </main>
  </div>

  <script src="trackers/header_bar.js"></script>
  <script src="trackers/runtime_tracker.js"></script>
  <script src="trackers/agent_panel.js"></script>
  <script src="trackers/stage_panel.js"></script>
  <script src="app.js"></script>
</body>
</html>

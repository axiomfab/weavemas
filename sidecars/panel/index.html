<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeaveMX UI</title>
  <script>
    (function() {
      let saved = null;
      try {
        saved = window.localStorage ? window.localStorage.getItem('weavemx-ui-theme') : null;
      } catch (err) {
        saved = null;
      }
      const hostMode = (window.__WEAVEMX_HOST_THEME__ && (window.__WEAVEMX_HOST_THEME__.mode === 'light' || window.__WEAVEMX_HOST_THEME__.mode === 'dark'))
        ? window.__WEAVEMX_HOST_THEME__.mode
        : null;
      const theme = (saved === 'light' || saved === 'dark') ? saved : (hostMode || 'dark');
      const root = document.documentElement;
      root.setAttribute('data-theme', theme);
      root.style.colorScheme = theme;
      if ((saved === 'light' || saved === 'dark') && hostMode && saved !== hostMode) {
        root.setAttribute('data-theme-override', saved);
      }
      if (typeof window.addEventListener === 'function') {
        window.addEventListener('message', function(ev) {
          const msg = ev && ev.data;
          if (!msg || typeof msg !== 'object') return;
          if (msg.type === 'theme-change') {
            const raw = String(msg.theme || msg.mode || '').toLowerCase();
            const next = (raw === 'light' || raw === 'hclight' || raw === '1' || raw === 'theme_mode_light') ? 'light' : (raw ? 'dark' : null);
            const seedEl = document.getElementById ? document.getElementById('agy-host-theme-seed') : null;
            if (msg.cssVariables && typeof msg.cssVariables === 'object') {
              if (seedEl && typeof seedEl.remove === 'function') seedEl.remove();
              if (root.style && typeof root.style.removeProperty === 'function') {
                ['--shell', '--onyx-well', '--secondary', '--secondary-foreground', '--muted', '--muted-foreground', '--placeholder', '--card', '--card-border', '--border', '--success', '--warning', '--error', '--link'].forEach(function(k) {
                  if (!(k in msg.cssVariables)) root.style.removeProperty(k);
                });
              }
              if (root.style && typeof root.style.setProperty === 'function') {
                Object.keys(msg.cssVariables).forEach(function(k) {
                  if (/^--[a-z0-9-]+$/i.test(k)) root.style.setProperty(k, String(msg.cssVariables[k]));
                });
              }
            } else if (next && seedEl && window.__WEAVEMX_HOST_THEME__ && window.__WEAVEMX_HOST_THEME__.mode && window.__WEAVEMX_HOST_THEME__.mode !== next) {
              if (typeof seedEl.remove === 'function') seedEl.remove();
            }
            if (next) {
              if (typeof root.removeAttribute === 'function') root.removeAttribute('data-theme-override');
              root.setAttribute('data-theme', next);
              if (root.dataset) root.dataset.theme = next;
              root.style.colorScheme = next;
            }
          }
        });
      }
    })();
  </script>
  <script src="/preload.js"></script>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen text-xs select-none">
  <!-- Flat Native AGY Header & Run Selector -->
  <header id="header-root"></header>

  <div class="max-w-4xl mx-auto p-3 space-y-4">
    <div id="error-banner-root" style="display: none;"></div>

    <!-- Horizontal Pipeline Stepper (Seamless / No Card) -->
    <section id="stepper-root" class="py-2.5 px-1">
      <div class="relative my-2">
        <!-- Connecting Line through circle centers -->
        <div id="stepper-line" class="stepper-line" style="display: none;"></div>

        <!-- Stage Dots Row -->
        <div id="stages-stepper-row" class="relative z-10 flex justify-between items-start">
          <!-- Rendered dynamically via app.js -->
        </div>
      </div>
    </section>

    <!-- Multi-Stage Agents Panel (Always Visible) -->
    <main id="agents-root">
      <!-- Dynamically mounted multi-stage agents panel -->
    </main>
  </div>

  <script src="trackers/header_bar.js"></script>
  <script src="trackers/runtime_tracker.js"></script>
  <script src="trackers/agent_panel.js"></script>
  <script src="trackers/stage_panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
